<!DOCTYPE html>

<html lang="no">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Filmer - Ryan Gosling</title>

    <!--
        Samme CSS-fil brukes på denne siden.
    -->

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!--
        ============================
        NAVIGASJON
        ============================
    -->

    <nav class="navbar">

        <h2>Ryan Gosling</h2>

        <div class="nav-links">

            <a href="index.html">Hjem</a>

            <a href="karriere.html">
                Livet og karrieren
            </a>

            <a href="filmer.html">Filmer</a>

            <a href="galleri.html">Galleri</a>

        </div>

    </nav>


    <main>


        <section class="page-header">

            <h1>Filmer</h1>

            <p>
                Noen kjente filmer med Ryan Gosling.
            </p>

        </section>


        <!--
            ============================
            FILMKORT
            ============================

            Alle filmene ligger inni "movie-container".

            CSS kan bruke denne klassen til å bestemme
            hvordan filmkortene skal plasseres.
        -->

        <section class="movie-container">


            <!--
                FILM 1
            -->

            <div class="movie-card">

                <img
                    src="bilder/film1.jpg"
                    alt="Plakat fra filmen Barbie"
                >

                <div class="movie-info">

                    <h2>Barbie</h2>

                    <p class="year">
                        2023
                    </p>

                    <p>
                        Ryan Gosling spiller rollen som Ken
                        i filmen Barbie.
                    </p>

                    <!--
                        target="_blank" gjør at lenken åpnes
                        i en ny fane.

                        Elevene kan selv finne en passende
                        lenke til mer informasjon.
                    -->

                    <a
                        href="https://www.imdb.com/"
                        target="_blank"
                        class="button"
                    >
                        Les mer
                    </a>

                </div>

            </div>


            <!--
                FILM 2
            -->

            <div class="movie-card">

                <img
                    src="bilder/film2.jpg"
                    alt="Plakat fra filmen La La Land"
                >

                <div class="movie-info">

                    <h2>La La Land</h2>

                    <p class="year">
                        2016
                    </p>

                    <p>
                        En musikalsk romantisk dramafilm
                        hvor Gosling spiller Sebastian.
                    </p>

                    <a
                        href="https://www.imdb.com/"
                        target="_blank"
                        class="button"
                    >
                        Les mer
                    </a>

                </div>

            </div>


            <!--
                ELEVEN KAN LEGGE TIL FLERE FILMER HER.

                Kopier for eksempel hele:

                <div class="movie-card">
                    ...
                </div>

                og bytt ut informasjonen.
            -->


        </section>


    </main>


    <footer>

        <p>
            Nettside om Ryan Gosling
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
